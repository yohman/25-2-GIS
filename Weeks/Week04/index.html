<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>マップとマーカー</title>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'google-tiles': {
            type: 'raster',
            tiles: [
              'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'
            ],
            tileSize: 256
          }
        },
        layers: [
          {
            id: 'google-tiles-layer',
            type: 'raster',
            source: 'google-tiles',
            minzoom: 0,
            maxzoom: 19
          }
        ]
      },
      center: [139.7671, 35.6812],
      zoom: 2
    });

	map.on('load', () => {
  map.addSource('earthquakes', {
    type: 'geojson',
    data: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson'
  });

  map.addLayer({
    id: 'earthquakes-layer',
    type: 'circle',
    source: 'earthquakes',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['get', 'mag'], 4.5, 4, 7, 50],
      'circle-color': '#ff0000',
      'circle-opacity': 0.7
    }
  });
});

let popup;

map.on('mouseenter', 'earthquakes-layer', (e) => {
  const coords = e.features[0].geometry.coordinates;
  const props = e.features[0].properties;
  popup = new maplibregl.Popup({ closeOnClick: false })
    .setLngLat([coords[0], coords[1]])
    .setHTML(`<strong>${props.place}</strong><br>Magnitude: ${props.mag}`)
    .addTo(map);
  map.getCanvas().style.cursor = 'pointer';
});

map.on('mouseleave', 'earthquakes-layer', () => {
  map.getCanvas().style.cursor = '';
  if (popup) {
    popup.remove();
    popup = null;
  }
});
  </script>
</body>
</html>
