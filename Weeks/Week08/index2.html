<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>World Map - CartoDB Dark</title>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
    #legend {
      position: absolute;
      bottom: 30px;
      left: 10px;
      background: rgba(30,30,30,0.95);
      color: #fff;
      padding: 12px 16px;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      min-width: 140px;
    }
    .legend-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .legend-color {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      border-radius: 3px;
      border: 1px solid #888;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="legend"></div>
<div id="year-overlay" style="position:absolute;top:10px;left:20px;z-index:30;pointer-events:none;">
  <span id="year-overlay-label" style="font-size:10em;font-weight:bold;color:rgba(255,255,255,0.25);font-family:Arial,sans-serif;line-height:1;"></span>
</div>
<div style="position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;">
  <button id="play-btn" style="margin-right:12px;font-size:1.2em;padding:2px 16px;border-radius:5px;border:none;background:#222;color:#fff;cursor:pointer;">▶</button>
  <input id="year-slider" type="range" min="1789" max="2024" value="2024" step="1" style="width:400px;">
  <span id="year-label" style="color:#fff;font-family:Arial,sans-serif;font-size:16px;margin-left:10px;">2024</span>
</div>
<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [0, 20],
  zoom: 1.5
});

map.on('load', () => {
  map.addSource('countries', {
    type: 'geojson',
    data: 'countries.geojson'
  });

  map.addLayer({
    id: 'countries-fill',
    type: 'fill',
    source: 'countries',
    paint: {
      'fill-color': '#ffffff',
      'fill-opacity': 0.8
    }
  });

  // Fetch and join CSV data after GeoJSON is loaded
  fetch('countries.geojson')
    .then(res => res.json())
    .then(geojson => {
      fetch('political-regime/political-regime.csv')
        .then(res => res.text())
        .then(text => {
          const csvData = Papa.parse(text, { header: true }).data;

          // Build a lookup: Code -> [rows]
          const csvLookup = {};
          csvData.forEach(row => {
            if (row.Code) {
              if (!csvLookup[row.Code]) csvLookup[row.Code] = [];
              csvLookup[row.Code].push(row);
            }
          });

          // Palette and color assignment: reds for autocracies, blues for democracies
          const regimeOrder = ["0", "1", "2", "3"];
          const regimeLabels = {
            "0": "Closed Autocracy",
            "1": "Electoral Autocracy",
            "2": "Electoral Democracy",
            "3": "Liberal Democracy"
          };
          const regimeColorMap = {
            "0": "#b2182b", // dark red
            "1": "#ef8a62", // light red
            "2": "#67a9cf", // light blue
            "3": "#2166ac"  // dark blue
          };

          // Function to update map, legend, and waffle chart for a given year
          function updateForYear(year) {
            // Assign the regime for the selected year to each feature
            geojson.features.forEach(f => {
              const iso = f.properties && f.properties.iso_a3;
              if (iso) {
                const rows = csvLookup[iso] || [];
                let latest = null;
                rows.forEach(r => {
                  if (r.Year && Number(r.Year) <= year && (!latest || Number(r.Year) > Number(latest.Year))) {
                    latest = r;
                  }
                });
                f.properties['Political regime'] = latest ? latest['Political regime'] : undefined;
              }
            });

            // Collect unique regime values for legend/colors
            const regimeSet = new Set();
            geojson.features.forEach(f => {
              if (f.properties['Political regime']) {
                regimeSet.add(f.properties['Political regime']);
              }
            });
            const regimeList = Array.from(regimeSet);

            // Only include regimes present in the data for this year, but keep order 0-3
            const presentRegimes = regimeOrder.filter(r =>
              geojson.features.some(f => f.properties['Political regime'] === r)
            );

            // Build the match expression for fill-color
            const matchExpr = ['match', ['get', 'Political regime']];
            presentRegimes.forEach(regime => {
              matchExpr.push(regime, regimeColorMap[regime]);
            });
            matchExpr.push('rgba(0,0,0,0)'); // default transparent

            // --- Flicker fix: update source data and layer paint, do not remove/add layers ---
            if (map.getSource('countries-joined')) {
              map.getSource('countries-joined').setData(geojson);
              if (map.getLayer('countries-choropleth')) {
                map.setPaintProperty('countries-choropleth', 'fill-color', matchExpr);
              }
            } else {
              map.addSource('countries-joined', {
                type: 'geojson',
                data: geojson
              });
              map.addLayer({
                id: 'countries-choropleth',
                type: 'fill',
                source: 'countries-joined',
                paint: {
                  'fill-color': matchExpr,
                  'fill-opacity': 0.8
                }
              });
            }

            // Update legend and waffle chart in the same panel
            const legend = document.getElementById('legend');
            // --- Waffle Chart ---
            const countries = geojson.features
              .filter(f => f.properties['Political regime'])
              .map(f => ({
                regime: f.properties['Political regime'],
                color: regimeColorMap[f.properties['Political regime']],
                name: f.properties.name || f.properties.NAME || f.properties.iso_a3 || ""
              }));
            countries.sort((a, b) => {
              // Sort by regime order, then by name
              const aIdx = regimeOrder.indexOf(a.regime);
              const bIdx = regimeOrder.indexOf(b.regime);
              if (aIdx !== bIdx) return aIdx - bIdx;
              return a.name.localeCompare(b.name);
            });
            const cols = 20;
            const size = 10;
            const gap = 2;
            let waffleHTML = `<div style="font-size:13px;color:#fff;margin-bottom:4px;">Countries by regime</div>`;
            waffleHTML += `<div style="display:grid;grid-template-columns:repeat(${cols},${size}px);grid-gap:${gap}px;">`;
            countries.forEach((c, i) => {
              waffleHTML += `<div title="${c.name} (${regimeLabels[c.regime] || c.regime})" style="width:${size}px;height:${size}px;background:${c.color};border-radius:2px;display:inline-block;border:1px solid #222"></div>`;
            });
            waffleHTML += `</div>`;

            legend.innerHTML =
              '<div class="legend-title">Political Regime (' + year + ')</div>' +
              presentRegimes.map(regime =>
                `<div class="legend-item">
                  <span class="legend-color" style="background:${regimeColorMap[regime]}"></span>
                  <span>${regimeLabels[regime]}</span>
                </div>`
              ).join('') +
              '<hr style="border:0;border-top:1px solid #444;margin:10px 0;">' +
              waffleHTML;

            // Update year overlay in top left
            document.getElementById('year-overlay-label').textContent = year;
          }

          // Initial render for 2024
          updateForYear(2024);

          // Timeslider event
          const slider = document.getElementById('year-slider');
          const label = document.getElementById('year-label');
          slider.addEventListener('input', function() {
            const year = Number(this.value);
            label.textContent = year;
            updateForYear(year);
          });

          // --- Play Button ---
          const playBtn = document.getElementById('play-btn');
          let playing = false;
          let playInterval = null;

          playBtn.addEventListener('click', function() {
            if (!playing) {
              playing = true;
              playBtn.textContent = '⏸';
              playInterval = setInterval(() => {
                let year = Number(slider.value);
                if (year < Number(slider.max)) {
                  year++;
                  slider.value = year;
                  label.textContent = year;
                  updateForYear(year);
                } else {
                  playing = false;
                  playBtn.textContent = '▶';
                  clearInterval(playInterval);
                }
              }, 300);
            } else {
              playing = false;
              playBtn.textContent = '▶';
              clearInterval(playInterval);
            }
          });

          // Stop animation if user interacts with slider
          slider.addEventListener('mousedown', () => {
            if (playing) {
              playing = false;
              playBtn.textContent = '▶';
              clearInterval(playInterval);
            }
          });
        });
    });
});
</script>
</body>
</html>
