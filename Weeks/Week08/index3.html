<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>MapLibre + Carto DarkMatter + Countries</title>
	<link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
	<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
	<style>
		body {
			margin: 0;
			padding: 0;
		}

		#map {
			width: 100vw;
			height: 100vh;
		}
	</style>
</head>

<body>
	<div id="map"></div>
	<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
	<script>
		const map = new maplibregl.Map({
			container: 'map',
			style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
			center: [0, 20],
			zoom: 1.5
		});

		map.on('load', () => {
			// Only fetch, join, and add the joined layer ONCE, after map is loaded
			Promise.all([
				fetch('countries.csv').then(res => res.text()).then(text => Papa.parse(text, {
					header: true
				}).data),
				fetch('countries.geojson').then(res => res.json())
			]).then(([csvData, geojson]) => {
				// Build lookup from csv: iso2 -> row
				const csvLookup = {};
				csvData.forEach(row => {
					if (row.iso2) csvLookup[row.iso2] = row;
				});

				// Join: add csv row as 'csv' property to each feature if match
				let joinCount = 0;
				geojson.features.forEach(f => {
					const iso_a2 = f.properties && f.properties.iso_a2;
					if (iso_a2 && csvLookup[iso_a2]) {
						f.properties.csv = csvLookup[iso_a2];
						joinCount++;
					}
				});

				// Log proof of join
				const sample = geojson.features.find(f => f.properties && f.properties.csv);
				console.log('Number of joined features:', joinCount);
				if (sample) {
					console.log('Sample joined feature:', sample);
				} else {
					console.log('No joined features found.');
				}

				// --- Choropleth based on gdp field in joined csv ---
				// Compute breaks for gdp (quantiles or fixed)
				const gdps = geojson.features
					.map(f => f.properties.csv && Number(f.properties.csv.gdp))
					.filter(v => !isNaN(v));
				gdps.sort((a, b) => a - b);
				// 5-class breaks (min, 20%, 40%, 60%, 80%, max)
				const breaks = [
					gdps[0] || 0,
					gdps[Math.floor(gdps.length * 0.2)] || 0,
					gdps[Math.floor(gdps.length * 0.4)] || 0,
					gdps[Math.floor(gdps.length * 0.6)] || 0,
					gdps[Math.floor(gdps.length * 0.8)] || 0,
					gdps[gdps.length - 1] || 1
				];
				const colors = [
					'#fee5d9',
					'#fcae91',
					'#fb6a4a',
					'#de2d26',
					'#a50f15'
				];

				// Remove previous source/layer if present
				if (map.getLayer('countries-choropleth')) map.removeLayer('countries-choropleth');
				if (map.getSource('countries-joined')) map.removeSource('countries-joined');

				map.addSource('countries-joined', {
					type: 'geojson',
					data: geojson
				});

				map.addLayer({
					id: 'countries-choropleth',
					type: 'fill',
					source: 'countries-joined',
					paint: {
						'fill-color': [
							'interpolate',
							['linear'],
							['to-number', ['get', 'gdp', ['get', 'csv']]],
							breaks[0], colors[0],
							breaks[1], colors[1],
							breaks[2], colors[2],
							breaks[3], colors[3],
							breaks[4], colors[4]
						],
						'fill-opacity': 0.8
					}
				});
			});
		});
	</script>
</body>

</html>
