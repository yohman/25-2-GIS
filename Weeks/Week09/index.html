<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Tokyo 1km Mesh Population Map</title>
		<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
		<link
			href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css"
			rel="stylesheet"
		/>
		<style>
			body {
				margin: 0;
				padding: 0;
			}
			#map {
				width: 100%;
				height: 100vh;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
		<script>
			const map = new maplibregl.Map({
				container: 'map',
				style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
				center: [139.75, 35.68],
				zoom: 9
			});

			map.on('load', () => {
				map.addSource('tokyo', {
					type: 'geojson',
					data: 'tokyo_population.geojson'
				});

				map.addLayer({
					id: 'population-layer',
					type: 'fill',
					source: 'tokyo',
					paint: {
						'fill-color': [
							'case',
							['==', ['get', 'T001100001'], 0],
							'rgba(0,0,0,0)',
							[
								'interpolate',
								['linear'],
								['get', 'T001100001'],
								1,
								'#f0f9e8',
								1000,
								'#bae4bc',
								2000,
								'#7bccc4',
								5000,
								'#2b8cbe',
								10000,
								'#08589e'
							]
						],
						'fill-opacity': 0.75,
						'fill-outline-color': '#ffffff'
					}
				});

				const popup = new maplibregl.Popup({
					closeButton: false,
					closeOnClick: false
				});

				map.on('mousemove', 'population-layer', (e) => {
					if (e.features.length) {
						map.getCanvas().style.cursor = 'pointer';
						const population = e.features[0].properties.T001100001 || 0;
						popup
							.setLngLat(e.lngLat)
							.setHTML(`Population: ${population}`)
							.addTo(map);
					}
				});

				map.on('mouseleave', 'population-layer', () => {
					map.getCanvas().style.cursor = '';
					popup.remove();
				});
			});
		</script>
	</body>
</html>
